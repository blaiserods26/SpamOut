<!doctype html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml" xmlns:v="urn:schemas-microsoft-com:vml" xmlns:o="urn:schemas-microsoft-com:office:office">
<head>
  <meta charset="utf-8" />
  <meta content="width=device-width" name="viewport" />
  <meta content="IE=edge" http-equiv="X-UA-Compatible" />
  <meta name="x-apple-disable-message-reformatting" />
  <meta content="telephone=no,address=no,email=no,date=no,url=no" name="format-detection" />
  <title>Security Report</title>

  <link href="https://fonts.googleapis.com/css?family=Inter:400,500,600" rel="stylesheet" type="text/css">
  <link href="https://fonts.googleapis.com/css?family=Outfit:400" rel="stylesheet" type="text/css">

  <style>
    /* Base styles */
    html, body {
      margin: 0 !important;
      padding: 0 !important;
      background-color: #f5f6ff;
    }
    * {
      -ms-text-size-adjust: 100%;
      -webkit-text-size-adjust: 100%;
    }
    td {
      vertical-align: top;
      mso-table-lspace: 0pt !important;
      mso-table-rspace: 0pt !important;
    }
    a {
      text-decoration: none;
    }
    img {
      -ms-interpolation-mode: bicubic;
    }

    /* Dark mode styles */
    @media (prefers-color-scheme: dark) {
      body, .email-body {
        background-color: #1f2635 !important;
      }
      .email-container {
        background-color: #2c3444 !important;
        border-color: #6361f2 !important;
      }
      .logo-bg {
        background-color: #edf1fd !important;
        padding: 10px !important;
      }
      .text-dark {
        color: #ffffff !important;
      }
      .border-light {
        border-color: #3a4255 !important;
      }
      .bg-light {
        background-color: #3a4255 !important;
      }
      .status-section {
        background-color: #50576f !important;
        color: #ffffff !important;
      }
      .status-txt, .threat-status {
        color: {{ templateStyle.status_color }} !important;
      }
      .divider {
        border-color: #3a4255 !important;
      }
    }

    /* Responsive styles */
    @media only screen and (max-width: 599px) {
      .email-container {
        width: 100% !important;
      }
      .stack-column {
        display: block !important;
        width: 100% !important;
      }
      .mobile-center {
        text-align: center;
      }
    }
  </style>
  <!--[if mso]>
  <style>
    * {
      font-family: sans-serif !important;
    }
  </style>
  <![endif]-->
</head>

<body width="100%" style="background-color:#f5f6ff;margin:0;padding:0!important;" class="email-body">
  <div style="background-color:#f5f6ff">
    <!--[if gte mso 9]>
    <v:background xmlns:v="urn:schemas-microsoft-com:vml" fill="t">
    <v:fill type="tile" color="#f5f6ff"/>
    </v:background>
    <![endif]-->
    <table width="100%" cellpadding="0" cellspacing="0" border="0">
      <tr>
        <td align="center">
          <!-- Main container -->
          <table bgcolor="#ffffff" align="center" cellspacing="0" cellpadding="0" border="0" width="600" class="email-container" style="margin:0 auto; border:2px solid #6361f2;">
            <!-- Header with logo -->
            <tr>
              <td align="center" style="padding: 20px 0;" class="logo-bg">
                <img src="https://media.marka-img.com/bf85e0d6/g8yqosRfYydBlOSbvZeagYOfPpvJwV.png" width="204" style="max-width:204px; width: 100%; height: auto; display: block;">
              </td>
            </tr>

            <!-- Email contact -->
            <tr>
              <td align="center" style="padding: 0 24px;">
                <div style="color:#98a2b3;font-family:Inter,Arial,sans-serif;font-size:13px;line-height:24px;">
                  <a style="color:#98a2b3;text-decoration:none;" href="mailto:spamout.service@gmail.com">spamout.service@gmail.com</a>
                </div>
              </td>
            </tr>

            <!-- Divider -->
            <tr>
              <td style="padding: 9px 24px;">
                <table cellpadding="0" cellspacing="0" height="1" width="100%" class="divider" style="border-bottom: 1px solid #e0e0e0;">
                  <tr><td></td></tr>
                </table>
              </td>
            </tr>

            <!-- Security Score Section -->
            <tr>
              <td align="center" style="padding: 16px 24px;">
                <!-- Score icon -->
                <img src="{{ securityAnalysis.statusImgSrc }}" width="157" style="width:157px; height: auto; display: block;">

                <!-- Score title -->
                <div style="margin-top: 16px; color:#1f2635; font-weight:600; font-family:Inter,Arial,sans-serif; font-size:20px; line-height:36px;" class="text-dark">
                  Overall Security Score
                </div>

                <!-- Score value -->
                <div style="margin: 6px 0; display: inline-block; border: 2px solid #d4d4ee; border-radius: 4px; padding: 0 10px;" class="border-light">
                  <span style="color:{{ templateStyle.score_color }}; font-weight:600; font-family:Inter,Arial,sans-serif; font-size:24px; line-height:36px;">{{ securityAnalysis.overallScore }}</span>
                </div>

                <!-- Analyzed email -->
                <div style="margin-top: 16px; background-color:#efeffe; border-left: 5px solid #6461f2; padding: 24px; width: 320px;" class="bg-light">
                  <div style="color:#6461f2; font-weight:600; font-family:Inter,Arial,sans-serif; font-size:19px; line-height:24px;">
                    <a style="color:#7876f0; text-decoration:none;">{{ securityAnalysis.email }}</a>
                  </div>
                  <div style="color:#667085; font-weight:500; font-family:Inter,Arial,sans-serif; font-size:13px; line-height:24px;" class="text-dark">
                    Analysed Email
                  </div>
                </div>

                <!-- Domain info -->
                <div style="margin-top: 16px; border: 2px solid #efeffe; border-radius: 4px; padding: 4px 10px; display: inline-block;" class="border-light">
                  <span style="color:#535d72; font-family:Inter,Arial,sans-serif; font-size:15px; line-height:24px;" class="text-dark">Domain:</span>
                  <span style="color:#7876f0; font-family:Inter,Arial,sans-serif; font-size:15px; line-height:24px; margin-left: 7px;">{{ securityAnalysis.domain }}</span>
                </div>

                <!-- Divider -->
                <div style="margin: 16px 0; width: 100%;">
                  <table cellpadding="0" cellspacing="0" height="1" width="100%" class="divider" style="border-bottom: 1px solid #e0e0e0;">
                    <tr><td></td></tr>
                  </table>
                </div>

                <!-- View Attachment Report button -->
                <div style="margin: 16px 0; background-color:#efeffe; padding: 28px 24px;" class="bg-light">
                  <a href="{{download_url}}" style="text-decoration:none;">
                    <table cellspacing="0" cellpadding="0" border="0" style="margin: 0 auto;">
                      <tr>
                        <td align="center" style="background-color:#6461f2; border-radius:8px; padding: 13px 24px; box-shadow: 0px 2px 0px 0px rgba(0, 0, 0, 0.043);">
                          <img src="https://media.marka-img.com/bf85e0d6/2PXfmEw5Y1smZERIbwouXsgmQtm9cR.png" width="24" style="width:24px; height:auto; display:inline-block; vertical-align:middle;">
                          <span style="color:#ffffff; font-weight:600; font-family:Inter,Arial,sans-serif; font-size:18px; line-height:24px; margin-left:7px; vertical-align:middle;">Download Detailed Report</span>
                        </td>
                      </tr>
                    </table>
                  </a>

                  <!-- Status section -->
                  <div class="status-section" style="margin-top: 24px; padding: 7px 0; background-color:{{ templateStyle.status_bg_color }};">
                    <div class="threat-status" style="color:{{ templateStyle.status_color }}; font-family:Outfit,Arial,sans-serif; font-size:18px; letter-spacing:-0.01em; line-height:28px; text-align:center;">
                      {{ securityAnalysis.statusText }}
                    </div>
                    <div style="text-align: center; margin: 8px 0;">
                      <span class="status-txt" style="color:{{ templateStyle.status_color }}; font-family:Outfit,Arial,sans-serif; font-size:18px; letter-spacing:-0.01em; line-height:28px; vertical-align:middle;">Status</span>
                      <img src="{{ securityAnalysis.statusImgSrc }}" width="17" style="margin-left: 4px; width:17px; height:auto; display:inline-block; vertical-align:middle;">
                    </div>
                  </div>
                </div>
              </td>
            </tr>
            <!-- Bottom spacing -->
            <tr>
              <td style="height: 21px;"></td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </div>
</body>
</html>
